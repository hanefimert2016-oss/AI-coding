name: Unity Personal GitHub runner activation experiment

on:
  workflow_dispatch:
  push:
    branches: [gui-computer-use-20261023]
    paths:
      - ".github/workflows/unity-personal-runner-experiment.yml"

permissions:
  contents: read

jobs:
  activate-personal-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify license secret without displaying its content
        id: prereq
        env:
          UNITY_ENTITLEMENT_XML: ${{ secrets.UNITY_ENTITLEMENT_XML }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_ENTITLEMENT_XML" ]]; then
            echo "::error::UNITY_ENTITLEMENT_XML missing. Add it locally via gh secret set; do not paste license into code or chat."
            exit 2
          fi
          echo "Encrypted XML secret is present."

      - name: Install official Unity CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            https://unity.com/install.sh -o /tmp/unity-cli-install.sh
          bash /tmp/unity-cli-install.sh
          export PATH="$HOME/.local/bin:$HOME/bin:$HOME/.unity/bin:$PATH"
          BINARY=$(command -v unity || find "$HOME" -maxdepth 6 -type f -name unity -perm -u+x -print -quit)
          test -n "$BINARY"
          echo "UNITY_CLI_BINARY=$BINARY" >> "$GITHUB_ENV"
          "$BINARY" --version

      - name: Try legitimate existing named-user entitlement file on new runner
        id: licensing
        env:
          UNITY_ENTITLEMENT_XML: ${{ secrets.UNITY_ENTITLEMENT_XML }}
        run: |
          set -euo pipefail
          unset UNITY_EMAIL UNITY_PASSWORD UNITY_SERVICE_ACCOUNT_ID UNITY_SERVICE_ACCOUNT_SECRET || true
          LICENSE_DIR="$HOME/.config/unity3d/Unity/licenses"
          install -m 700 -d "$LICENSE_DIR"
          LICENSE_FILE="$LICENSE_DIR/UnityEntitlementLicense.xml"
          umask 077
          printf '%s' "$UNITY_ENTITLEMENT_XML" > "$LICENSE_FILE"
          unset UNITY_ENTITLEMENT_XML

          # Never emit the entitlement XML or Unity's potentially identifying raw license response.
          if "$UNITY_CLI_BINARY" license status >/dev/null 2>&1; then
            echo "UNITY_PERSONAL_ACTIVATION=ACCEPTED_FROM_INSTALLED_ENTITLEMENT" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          timeout 120s "$UNITY_CLI_BINARY" license activate --file "$LICENSE_FILE" --non-interactive >/dev/null 2>&1
          CODE=$?
          set -e
          if "$UNITY_CLI_BINARY" license status >/dev/null 2>&1; then
            echo "UNITY_PERSONAL_ACTIVATION=ACCEPTED_BY_UNITY_LICENSING_CLIENT" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "UNITY_PERSONAL_ACTIVATION=REJECTED_OR_UNSUPPORTED (activation command exit $CODE)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::The named-user XML was not accepted on this fresh GitHub-hosted runner. No license bypass or automatic Unity Hub sign-in has been performed."
          exit 3

      - name: Clean entitlement file
        if: always()
        run: |
          rm -f "$HOME/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml"
          echo "Experiment ended; GitHub-hosted runner is ephemeral." >> "$GITHUB_STEP_SUMMARY"
