name: AETHER-01 - Rigged Human Blender Walk Run Punch GLB Video

on:
  push:
    branches: [aether-humanoid-rig-20261025]
    paths:
      - ".github/workflows/aether-humanoid-character.yml"
      - "humanoid-motion-studio/character_builder.py"
      - "humanoid-motion-studio/render_poses_and_motion.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-humanoid-artifacts
  cancel-in-progress: true

jobs:
  rig-animate-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aether-humanoid-rig-20261025
          fetch-depth: 0

      - name: Install Blender software rendering and professional video tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive timeout 480s apt-get install -y --no-install-recommends \
            blender python3-numpy python3-pil xvfb xauth openbox xdotool wmctrl scrot ffmpeg \
            libgl1-mesa-dri fonts-dejavu-core
          mkdir -p humanoid-motion-studio/outputs
          blender -b --python-expr "import bpy,numpy; print('BLENDER_CHECK',bpy.app.version_string,numpy.__version__)" \
            | tee humanoid-motion-studio/outputs/blender-version.txt

      - name: First compile character, skeleton and GLB in headless Blender to test scripts
        run: |
          set -euo pipefail
          mkdir -p /tmp/aether-headless
          timeout 240s blender -b -t 4 --python humanoid-motion-studio/character_builder.py -- \
            /tmp/aether-headless > humanoid-motion-studio/outputs/headless-model-test.log 2>&1 || {
              tail -100 humanoid-motion-studio/outputs/headless-model-test.log; exit 1;
            }
          grep -E "AETHER_(COMPLETED|RIG_BONES|CHARACTER_MESHES|ACTIONS)" humanoid-motion-studio/outputs/headless-model-test.log
          python3 - <<'PY'
          import pathlib,json,struct
          p=pathlib.Path("/tmp/aether-headless/AETHER-01-Rigged-Animated-Human.glb")
          b=p.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from("<I",b,8)[0]==len(b)
          size=struct.unpack_from("<I",b,12)[0]
          data=json.loads(b[20:20+size])
          names=[a.get("name","") for a in data.get("animations",[])]
          print("GLB_ANIMATION_NAMES",names,flush=True)
          print("GLB_BONES",len(data.get("skins",[])),flush=True)
          print("GLB_MESH_COUNT",len(data.get("meshes",[])),flush=True)
          assert len(data.get("skins",[]))>=1, "GLB lacks any skeleton skin"
          assert len(data.get("animations",[]))>=4, "GLB missing clips: "+repr(names)
          assert len(data.get("meshes",[]))>=50, "GLB lacks detailed character meshes"
          pathlib.Path("humanoid-motion-studio/outputs/glb-test.txt").write_text(
              "SKINS=%d\nANIMATIONS=%s\nMESHES=%d\n"%
              (len(data['skins']),",".join(names),len(data['meshes'])))
          PY

      - name: Record real interactive Blender as humanoid is modeled rigged and animated
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/humanoid-motion-studio/outputs"
          export DISPLAY=:93 LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5
          Xvfb :93 -screen 0 1600x900x24 -nolisten tcp > "$OUT/xvfb.log" 2>&1 &
          XVPID=$!
          sleep 2
          openbox > "$OUT/window-manager.log" 2>&1 &
          WMPID=$!
          sleep 2
          echo 'BLENDER STARTING / CREATING HUMAN MODEL' > "$OUT/current-stage.txt"
          timeout 155s blender -W --python humanoid-motion-studio/character_builder.py -- \
            "$OUT" --live > "$OUT/live-modeling.log" 2>&1 &
          BPID=$!
          sleep 6
          xdotool search --name 'Blender' windowactivate 2>/dev/null || true
          xdotool key Escape || true
          wmctrl -r ':ACTIVE:' -b add,maximized_vert,maximized_horz || true
          wmctrl -l | tee "$OUT/open-windows.txt"
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          FILTER="drawbox=x=0:y=0:w=iw:h=96:color=0x071726@0.9:t=fill,drawtext=fontfile=$FONT:text='AETHER 01 / REAL BLENDER 3D MODELING + RIGGING':fontsize=26:fontcolor=white:x=30:y=10,drawtext=fontfile=$FONT:textfile=$OUT/current-stage.txt:reload=1:fontsize=21:fontcolor=0x50dfff:x=30:y=50,scale=1280:720"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f x11grab -framerate 24 -video_size 1600x900 -i :93 \
            -t 133 -vf "$FILTER" -c:v libx264 -profile:v baseline -level:v 3.1 \
            -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart \
            "$OUT/AETHER-01-Blender-Modeling-Rigging-Process.mp4" \
            > "$OUT/video-capture.log" 2>&1 &
          RECPID=$!
          sleep 25
          scrot "$OUT/06-Blender-Modeling-Early.png"
          sleep 30
          scrot "$OUT/07-Blender-Modeling-Middle.png"
          sleep 39
          scrot "$OUT/08-Blender-Finished-Character.png"
          result=0
          for _ in $(seq 1 45); do
            grep -q AETHER_COMPLETED "$OUT/live-modeling.log" && break
            if ! kill -0 "$BPID" 2>/dev/null; then
              echo "::error::Blender exited before final GLB export"
              result=1
              break
            fi
            sleep 1
          done
          if ! grep -q AETHER_COMPLETED "$OUT/live-modeling.log"; then
            tail -120 "$OUT/live-modeling.log"
            result=1
          fi
          wait "$RECPID" || { cat "$OUT/video-capture.log"; result=1; }
          kill "$BPID" "$XVPID" "$WMPID" 2>/dev/null || true
          wait "$BPID" 2>/dev/null || true
          test "$result" -eq 0
          grep -E "^AETHER_STAGE|^AETHER_(COMPLETED|ACTIONS|RIG_BONES|CHARACTER_MESHES)" "$OUT/live-modeling.log" \
            | tee "$OUT/modeling-phases.txt"
          test -s "$OUT/AETHER-01-Rigged-Animated-Human.glb"
          test -s "$OUT/AETHER-01-Rigged-Animated-Human.blend"

      - name: Render character portraits and true Walk Run Punch animation frames
        run: |
          set -euo pipefail
          OUT="$PWD/humanoid-motion-studio/outputs"
          timeout 980s blender -b -t 4 "$OUT/AETHER-01-Rigged-Animated-Human.blend" \
            --python humanoid-motion-studio/render_poses_and_motion.py -- "$OUT" \
            > "$OUT/animation-render.log" 2>&1 || {
              tail -100 "$OUT/animation-render.log"; exit 1;
            }
          grep -E "AETHER_(RENDER|MOTION_RENDERED|MOTION_FRAMES_TOTAL)" "$OUT/animation-render.log"
          test "$(find "$OUT/sample_frames" -type f -name 'frame-*.png' | wc -l)" -eq 96

      - name: Encode 4 real skeletal animation previews into single mobile-friendly MP4
        run: |
          set -euo pipefail
          OUT=humanoid-motion-studio/outputs
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          FILTER="drawbox=x=0:y=0:w=iw:h=57:color=0x04172a@0.87:t=fill,drawtext=fontfile=$FONT:text='AETHER 01  /  IDLE    WALK    RUN    PUNCH':fontsize=20:fontcolor=white:x=21:y=15,drawtext=fontfile=$FONT:text='IDLE':enable='between(t,0,1.99)':fontsize=34:fontcolor=0x37ddff:x=24:y=70,drawtext=fontfile=$FONT:text='WALK':enable='between(t,2,3.99)':fontsize=34:fontcolor=0x37ddff:x=24:y=70,drawtext=fontfile=$FONT:text='RUN':enable='between(t,4,5.99)':fontsize=34:fontcolor=0x37ddff:x=24:y=70,drawtext=fontfile=$FONT:text='PUNCH':enable='between(t,6,8)':fontsize=34:fontcolor=0x37ddff:x=24:y=70"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -framerate 12 -i "$OUT/sample_frames/frame-%04d.png" \
            -vf "$FILTER" -c:v libx264 -profile:v baseline -level:v 3.1 \
            -pix_fmt yuv420p -crf 19 -preset medium -movflags +faststart \
            "$OUT/AETHER-01-Idle-Walk-Run-Punch-Demo.mp4"
          test -s "$OUT/AETHER-01-Idle-Walk-Run-Punch-Demo.mp4"
          # Keep a cross-section of source PNG frames, avoid publishing 96 redundant images.
          cp "$OUT/sample_frames/frame-0006.png" "$OUT/09-Idle-Sample.png"
          cp "$OUT/sample_frames/frame-0034.png" "$OUT/10-Walk-Sample.png"
          cp "$OUT/sample_frames/frame-0058.png" "$OUT/11-Run-Sample.png"
          cp "$OUT/sample_frames/frame-0084.png" "$OUT/12-Punch-Sample.png"
          rm -rf "$OUT/sample_frames"

      - name: Verify GLB skeleton animations files playback and visibly changing Blender video
        run: |
          set -euo pipefail
          OUT=humanoid-motion-studio/outputs
          python3 - <<'PY'
          import pathlib,json,struct
          from PIL import Image,ImageStat
          out=pathlib.Path("humanoid-motion-studio/outputs")
          b=(out/"AETHER-01-Rigged-Animated-Human.glb").read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from("<I",b,8)[0]==len(b)
          jsonlen=struct.unpack_from("<I",b,12)[0]
          glb=json.loads(b[20:20+jsonlen])
          names=[x.get("name","") for x in glb.get("animations",[])]
          print("GLB_ANIMATION_ACTIONS",names)
          assert len(names)>=4,"Missing animation actions"
          assert any("Walk" in n for n in names)
          assert any("Run" in n for n in names)
          assert any("Punch" in n for n in names)
          assert len(glb.get("skins",[]))>0
          assert len(glb.get("meshes",[]))>=50
          assert (out/"AETHER-01-Rigged-Animated-Human.blend").read_bytes()[:7]==b'BLENDER'
          for filename in ["06-Blender-Modeling-Early.png","07-Blender-Modeling-Middle.png",
                           "08-Blender-Finished-Character.png"]:
              im=Image.open(out/filename).convert("RGB")
              v=ImageStat.Stat(im).stddev
              assert min(v)>7,(filename,v)
          for i in range(1,6):
              im=Image.open(out/("%02d-"%i + ["AETHER-Human-Neutral.png","AETHER-Walking.png",
                  "AETHER-Running.png","AETHER-Punching.png","AETHER-Portrait-Closeup.png"][i-1]))
              assert im.size==(1440,810)
          print("GLB_SKELETON_AND_4_CLIPS_VERIFIED","meshes",len(glb['meshes']),"skins",len(glb['skins']))
          PY
          for movie in "$OUT/AETHER-01-Blender-Modeling-Rigging-Process.mp4" \
                       "$OUT/AETHER-01-Idle-Walk-Run-Punch-Demo.mp4"; do
            ffmpeg -hide_banner -nostdin -loglevel error -xerror -i "$movie" -f null - \
              > "$OUT/$(basename "$movie" .mp4)-decoder.txt" 2>&1
            ffprobe -v error -show_entries stream=codec_name,profile,width,height,nb_frames:format=duration,size \
              -of default=nw=1 "$movie" \
              | tee "$OUT/$(basename "$movie" .mp4)-metadata.txt"
          done
          for t in 20 55 92; do
            ffmpeg -hide_banner -nostdin -loglevel error -ss "$t" \
              -i "$OUT/AETHER-01-Blender-Modeling-Rigging-Process.mp4" \
              -vf 'crop=850:490:220:150' -frames:v 1 -f md5 - \
              > "$OUT/blender-scene-$t.md5"
          done
          ! cmp -s "$OUT/blender-scene-20.md5" "$OUT/blender-scene-55.md5" \
            || { echo "::error::Blender modeling screen frozen between construction stages"; exit 1; }
          ! cmp -s "$OUT/blender-scene-55.md5" "$OUT/blender-scene-92.md5" \
            || { echo "::error::Blender viewport frozen near end"; exit 1; }
          echo "AETHER FULL VALIDATION PASSED / glTF skin and animations; 2 videos fully decodable; viewport visibly changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Push checked GLB BLEND video and PNG deliverables to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add humanoid-motion-studio/outputs
          git commit -m "Deliver AETHER 01 human skeletal animations BLEND GLB PNG and 2 recorded MP4s"
          git push origin HEAD:aether-humanoid-rig-20261025
      - name: Upload complete project package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-01-Human-Rig-Walk-Run-Punch-GLB-BLEND-MP4-PNG
          path: humanoid-motion-studio/outputs/
          retention-days: 14
          if-no-files-found: warn
