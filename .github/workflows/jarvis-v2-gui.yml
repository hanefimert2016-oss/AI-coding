name: JARVIS V2 fast GUI Blender cinema
on:
  push:
    branches: [gui-computer-use-20261023]
    paths: [".github/workflows/jarvis-v2-gui.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-gui-blender-cinema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XFCE, Blender, Chrome host tools and Kdenlive
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth xfwm4 xfdesktop4 xfce4-panel xfce4-session \
            dbus-x11 x11-utils xdotool scrot mesa-utils libgl1-mesa-dri \
            blender kdenlive ffmpeg curl ca-certificates fonts-dejavu-core
      - name: Run accelerated physical-keyboard/mouse Blender and Kdenlive session
        run: bash experiments/gui-computer-use/record-v2.sh
      - name: Inspect output verification
        if: always()
        run: |
          ls -lh captures output 2>/dev/null || true
          cat output/model-verification.txt 2>/dev/null | grep 'VERIFIED_' || true
          for video in captures/*.mp4 output/JARVIS-Cinematic-Edit.mp4; do
            test -f "$video" && ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$video"
          done
      - name: Publish source Blender scene, edited MP4 and full desktop capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2-desktop-model-cinema
          path: |
            captures/*.mp4
            captures/*.png
            output/JARVIS-Cinematic-Edit.mp4
            output/JARVIS-Industrial-Robot-Arm.blend
            output/model-verification.txt
            output/ATTRIBUTION.txt
          retention-days: 7
          if-no-files-found: warn
